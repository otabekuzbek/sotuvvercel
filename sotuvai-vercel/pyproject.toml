[project]
name = "sotuvai"
version = "0.2.0"
description = "Sotuv qo'ng'iroqlarini AI bilan tahlil qilish platformasi (amoCRM + Google STT + Claude)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<2.1",
    "httpx>=0.27,<0.29",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "itsdangerous>=2.2,<3",
    "psycopg2-binary>=2.9,<3",
    "imageio-ffmpeg>=0.5,<1",
]

[tool.vercel]
entrypoint = "app.main:app"
